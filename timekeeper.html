                    </div>
                    <div style={{ fontSize: 12, color: "#9ca3af", textAlign: "right", lineHeight: 1.6 }}>
                      <div>{fmtHrs(hrs)}h total</div>
                      <div>{pe.length} entries</div>
                    </div>
                    <button onClick={() => startEditProject(proj)} style={s.btnGhost}>✎</button>
                    {proj.billable !== false && (
                      <button onClick={() => deleteProject(proj.id)} style={s.btnGhost}>✕</button>
                    )}
                  </div>
                );
              })}
            </div>

            {/* Archived projects */}
            {projects.some(p => p.archived) && (
              <div style={{ marginTop: 20 }}>
                <button onClick={() => setShowArchived(v => !v)} style={{
                  background: "none", border: "none", cursor: "pointer",
                  fontSize: 12, color: "#9ca3af", padding: "4px 0", display: "flex", alignItems: "center", gap: 6
                }}>
                  <span>{showArchived ? "▲" : "▼"}</span>
                  <span>Archived ({projects.filter(p => p.archived).length})</span>
                </button>
                {showArchived && (
                  <div style={{ display: "flex", flexDirection: "column", gap: 6, marginTop: 8 }}>
                    {projects.filter(p => p.archived).map(proj => {
                      const pe = entries.filter(e => e.projectId === proj.id);
                      const hrs = pe.reduce((s, e) => s + e.hours, 0);
                      return (
                        <div key={proj.id} style={{
                          ...s.card, display: "flex", alignItems: "center", gap: 12, padding: "12px 16px",
                          opacity: 0.6, background: "#f9fafb"
                        }}>
                          <div style={{ width: 10, height: 10, borderRadius: "50%", background: proj.color, flexShrink: 0 }} />
                          <div style={{ flex: 1 }}>
                            <span style={{ fontSize: 14, fontWeight: 500, color: "#374151" }}>{proj.name}</span>
                            {proj.code && <span style={{
                              fontSize: 11, color: "#9ca3af", fontFamily: "monospace", marginLeft: 8,
                              background: "#f3f4f6", padding: "1px 6px", borderRadius: 3
                            }}>{proj.code}</span>}
                          </div>
                          <div style={{ fontSize: 12, color: "#9ca3af", textAlign: "right", lineHeight: 1.6 }}>
                            <div>{fmtHrs(hrs)}h total</div>
                            <div>{pe.length} entries</div>
                          </div>
                          <button onClick={() => restoreProject(proj.id)} style={s.btnGhost}>Restore</button>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}
          </div>
        )}

        {tab === "export" && (
          <div>

            {/* ── AI expansion ── */}
            {(() => {
              const [y, m] = xMonth.split("-");
              const mStart = xMonth + "-01";
              const mEnd = fmtDate(new Date(parseInt(y), parseInt(m), 0));
              const monthEntries = entries.filter(e =>
                e.date >= mStart && e.date <= mEnd &&
                projMap[e.projectId]?.billable !== false
              );
              const withNote = monthEntries.filter(e => e.note);
              const withAi   = monthEntries.filter(e => e.aiNote);
              const clearAiNotes = () => {
                setEntries(prev => prev.map(e =>
                  monthEntries.find(me => me.id === e.id) ? { ...e, aiNote: "" } : e
                ));
                setAiStatus(null);
              };
              return (
                <div style={{ ...s.card, marginBottom: 14, border: "1px solid #c7d2fe", background: "#fafafe" }}>
                  <div style={{ fontSize: 10, fontWeight: 500, color: "#4f46e5", letterSpacing: "0.07em", marginBottom: 6 }}>AI NOTE EXPANSION</div>
                  <div style={{ fontSize: 15, fontWeight: 500, color: "#111827", marginBottom: 4 }}>Polish notes with Claude</div>
                  <div style={{ fontSize: 12, color: "#9ca3af", lineHeight: 1.6, marginBottom: 12 }}>
                    Expands brief daily notes into billable-quality descriptions. Run once at month-end before the Word export — the Word doc will use expanded notes where available.
                  </div>

                  {/* Status line */}
                  <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 12, fontSize: 12 }}>
                    <span style={{ color: withAi.length === withNote.length && withNote.length > 0 ? "#16a34a" : "#6b7280" }}>
                      {withNote.length === 0
                        ? "No notes logged for this month yet."
                        : withAi.length === 0
                          ? `${withNote.length} entries with notes — none expanded yet.`
                          : `${withAi.length} of ${withNote.length} entries expanded.`}
                    </span>
                    {withAi.length > 0 && (
                      <button onClick={clearAiNotes} style={{ ...s.btnGhost, color: "#ef4444", borderColor: "#fecaca" }}>
                        Clear expanded notes
                      </button>
                    )}
                  </div>

                  {/* API key */}
                  <div style={{ marginBottom: 10 }}>
                    <label style={s.label}>ANTHROPIC API KEY</label>
                    <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)}
                      placeholder="sk-ant-api03-…"
                      style={{ ...s.input, fontFamily: "monospace", fontSize: 12 }} />
                    <div style={{ fontSize: 10, color: "#9ca3af", marginTop: 4 }}>
                      Stored in localStorage on this machine only. Never leaves your browser except to reach api.anthropic.com.
                    </div>
                  </div>

                  {/* Custom instructions */}
                  <div style={{ marginBottom: 14 }}>
                    <label style={s.label}>CUSTOM INSTRUCTIONS (optional — tailor the output language)</label>
                    <textarea value={aiInstructions} onChange={e => setAiInstructions(e.target.value)}
                      rows={3}
                      placeholder={"e.g. Write in third person as \"the Architect\". Use \"Architect's Field Report\" instead of \"field report\". Match the tone of the example notes below:\n…"}
                      style={{ ...s.input, fontFamily: "system-ui", resize: "vertical", lineHeight: 1.5 }} />
                  </div>

                  <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                    <button
                      onClick={runAiExpansion}
                      disabled={aiRunning || !apiKey.trim() || withNote.length === 0}
                      style={{
                        ...s.btnPrimary("#4f46e5"),
                        opacity: (aiRunning || !apiKey.trim() || withNote.length === 0) ? 0.5 : 1,
                        cursor: (aiRunning || !apiKey.trim() || withNote.length === 0) ? "not-allowed" : "pointer",
                      }}>
                      {aiRunning ? "Expanding…" : `Expand ${withNote.length} note${withNote.length !== 1 ? "s" : ""}`}
                    </button>
                    {aiStatus && !aiStatus.error && (
                      <span style={{ fontSize: 12, color: "#16a34a" }}>
                        Done — {aiStatus.expanded} of {aiStatus.total} expanded.
                      </span>
                    )}
                    {aiStatus?.error && (
                      <span style={{ fontSize: 12, color: "#ef4444", flex: 1 }}>{aiStatus.error}</span>
                    )}
                  </div>
                </div>
              );
            })()}

            {/* ── Excel + Word ── */}
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14, marginBottom: 14 }}>

              <div style={s.card}>
                <div style={{ fontSize: 10, fontWeight: 500, color: "#16a34a", letterSpacing: "0.07em", marginBottom: 6 }}>WEEKLY TIMESHEET</div>
                <div style={{ fontSize: 15, fontWeight: 500, color: "#111827", marginBottom: 4 }}>Excel export</div>
                <div style={{ fontSize: 12, color: "#9ca3af", lineHeight: 1.6, marginBottom: 16 }}>
                  Matches the firm template — Job #, Services, Tasks columns, daily hours, and totals. Overhead rows (CE, AIA Awards, Marketing, Overhead) are filled from logged entries.
                </div>
                <div style={{ marginBottom: 12 }}>
                  <label style={s.label}>ANY DATE IN TARGET WEEK</label>
                  <input type="date" value={xWeek} onChange={e => setXWeek(e.target.value)} style={s.input} />
                </div>
                <div style={{ fontSize: 12, color: "#9ca3af", marginBottom: 12 }}>
                  Week: <strong style={{ color: "#374151" }}>{getMonday(xWeek)}</strong>
                  {" → "}
                  <strong style={{ color: "#374151" }}>{weekDatesFrom(getMonday(xWeek))[6]}</strong>
                </div>
                <button onClick={exportExcel} style={{ ...s.btnPrimary("#16a34a"), width: "100%" }}>↓ Download .xlsx</button>
              </div>

              <div style={s.card}>
                <div style={{ fontSize: 10, fontWeight: 500, color: "#d97706", letterSpacing: "0.07em", marginBottom: 6 }}>MONTHLY DESCRIPTIONS</div>
                <div style={{ fontSize: 15, fontWeight: 500, color: "#111827", marginBottom: 4 }}>Word export</div>
                <div style={{ fontSize: 12, color: "#9ca3af", lineHeight: 1.6, marginBottom: 16 }}>
                  One section per project — JOB DESCRIPTION/TIMESHEET header with weeks delineated. Uses AI-expanded notes where available.
                </div>
                <div style={{ marginBottom: 12 }}>
                  <label style={s.label}>BILLING MONTH</label>
                  <input type="month" value={xMonth} onChange={e => setXMonth(e.target.value)} style={s.input} />
                </div>
                <div style={{ fontSize: 12, color: "#9ca3af", marginBottom: 12 }}>
                  {(() => {
                    const me = entries.filter(e => e.date.startsWith(xMonth)
                      && projMap[e.projectId]?.billable !== false);
                    const aiCount = me.filter(e => e.aiNote).length;
                    return `${me.length} billable entries · ${fmtHrs(me.reduce((s, e) => s + e.hours, 0))}h · ${new Set(me.map(e => e.projectId)).size} projects${aiCount ? ` · ${aiCount} AI-expanded` : ""}`;
                  })()}
                </div>
                <button onClick={exportWord} style={{ ...s.btnPrimary("#d97706"), width: "100%" }}>↓ Download .doc</button>
              </div>

            </div>

          {/* Data storage */}
          <div style={{ ...s.card, marginTop: 14 }}>
            <div style={{ fontSize: 10, fontWeight: 500, color: "#9ca3af", letterSpacing: "0.07em", marginBottom: 6 }}>DATA STORAGE</div>
            <div style={{ fontSize: 12, color: "#6b7280", lineHeight: 1.6, marginBottom: 12 }}>
              {FS_SUPPORTED && dirHandle
                ? <>Saving to <code style={{ background: "#f3f4f6", padding: "1px 5px", borderRadius: 3, fontSize: 11 }}>data.json</code> in your chosen folder.</>
                : FS_SUPPORTED
                  ? "No data folder set. Pick one to save your data as a real file."
                  : "Saving to browser localStorage (Chrome/Edge required for file-based storage)."}
            </div>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              {FS_SUPPORTED && (
                <button onClick={pickFolder} style={s.btnGhost}>
                  {dirHandle ? "Change folder…" : "Choose folder…"}
                </button>
              )}
              <button onClick={backupData} style={s.btnGhost}>↓ Download backup</button>
              <button onClick={() => restoreInputRef.current?.click()} style={s.btnGhost}>↑ Restore from backup</button>
            </div>
            <input ref={restoreInputRef} type="file" accept=".json" onChange={restoreData}
              style={{ display: "none" }} />
          </div>

          </div>

        )}

      </div>

      {pending && (
        <EntryModal
          initial={pending}
          projects={projects}
          date={selectedDay}
          onConfirm={confirmEntry}
          onCancel={cancelEntry}
        />
      )}
      {editing && (
        <EntryModal
          initial={{
            startMin: editing.startMinutes,
            durationMin: hoursToMin(editing.hours),
            projectId: editing.projectId,
            note: editing.note,
            entryId: editing.id,
          }}
          projects={projects}
          date={editing.date}
          onConfirm={updateEntry}
          onCancel={cancelEdit}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
