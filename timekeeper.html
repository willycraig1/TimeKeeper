<div id="root"></div>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

// ----- Constants -----------------------------------------------------------

const PALETTE = [
  "#4f46e5","#3b82f6","#0ea5e9","#06b6d4","#14b8a6","#10b981",
  "#84cc16","#eab308","#f59e0b","#f97316","#ef4444","#f43f5e",
  "#ec4899","#d946ef","#a855f7","#8b5cf6","#64748b","#78716c",
];

const NONBILLABLE_ID = "_nonbillable";
const NONBILLABLE_DEFAULT = {
  id: NONBILLABLE_ID,
  name: "Non-billable (lunch / errands / admin)",
  code: "", color: "#94a3b8", billable: false,
};

const OVERHEAD_DEFAULTS = [
  { id: "_ce",        name: "Continuing Education", code: "", color: "#8b5cf6", billable: false, overhead: true },
  { id: "_aia",       name: "AIA Awards",           code: "", color: "#eab308", billable: false, overhead: true },
  { id: "_marketing", name: "Marketing",             code: "", color: "#f97316", billable: false, overhead: true },
  { id: "_office",    name: "Office",                code: "", color: "#64748b", billable: false, overhead: true },
];
// Short badge text shown in pickers and entry blocks for overhead projects
const OVERHEAD_BADGE = { _ce: "CE", _aia: "AIA", _marketing: "MKT", _office: "OFF" };
// Excel timesheet row labels match the firm's template (Office → "Overhead")
const OVERHEAD_EXCEL_LABEL = { _ce: "Continuing Education", _aia: "AIA Awards", _marketing: "Marketing", _office: "Overhead" };

const STORAGE_KEYS = { projects: "tk_projects_v2", entries: "tk_entries_v3" };

// Day timeline (vertical, daytimer-style)
// Default visible range is 7am–7pm; user can extend either end to midnight.
const DEFAULT_START_HOUR = 7;
const DEFAULT_END_HOUR = 19;
const HOUR_PX = 64;              // 64px per hour → 15-min block = 16px (fits 11px text)
const MIN_SNAP = 15;             // 15-minute snap
const TARGET_HOURS = 8;
const RANGE_STORAGE_KEY = "tk_timeline_range_v1";

const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

// ----- Date / time helpers -------------------------------------------------

const fmtDate = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const offsetDay = (s, delta) => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + delta); return fmtDate(d); };
const todayStr = () => fmtDate(new Date());
const dispDate = s => new Date(s + "T12:00:00").toLocaleDateString("en-US",
  { weekday: "short", month: "short", day: "numeric" });
const dispDateLong = s => new Date(s + "T12:00:00").toLocaleDateString("en-US",
  { weekday: "long", month: "long", day: "numeric", year: "numeric" });
const getMonday = s => {
  const d = new Date(s + "T12:00:00");
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  return fmtDate(d);
};
const weekDatesFrom = start => Array.from({ length: 7 }, (_, i) => {
  const d = new Date(start + "T12:00:00");
  d.setDate(d.getDate() + i);
  return fmtDate(d);
});
// Returns [{mon, sun}, ...] for each week whose Sunday falls within yearMonth ("YYYY-MM").
const getWeeksInMonth = yearMonth => {
  const [y, m] = yearMonth.split("-").map(Number);
  const firstDay = new Date(y, m - 1, 1);
  const lastDay = new Date(y, m, 0);
  const dow = firstDay.getDay();
  const firstSun = new Date(firstDay);
  if (dow !== 0) firstSun.setDate(firstSun.getDate() + (7 - dow));
  const weeks = [];
  let sun = new Date(firstSun);
  while (sun <= lastDay) {
    const mon = new Date(sun);
    mon.setDate(sun.getDate() - 6);
    weeks.push({ mon: fmtDate(mon), sun: fmtDate(sun) });
    sun = new Date(sun);
    sun.setDate(sun.getDate() + 7);
  }
  return weeks;
};

const minToHHMM = m => `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
const hhmmToMin = s => {
  const [h, m] = s.split(":").map(Number);
  return h * 60 + m;
};
const minToDisplay = m => {
  const h = Math.floor(m / 60), mm = m % 60;
  const ampm = h >= 12 ? "PM" : "AM";
  const h12 = ((h + 11) % 12) + 1;
  return `${h12}:${String(mm).padStart(2, "0")} ${ampm}`;
};
// Compact form for inline display inside small entry blocks (no AM/PM).
const minToShort = m => {
  const h = Math.floor(m / 60), mm = m % 60;
  const h12 = ((h + 11) % 12) + 1;
  return `${h12}:${String(mm).padStart(2, "0")}`;
};
const snapMin = m => Math.floor(m / MIN_SNAP) * MIN_SNAP;
const hoursToMin = h => Math.round(h * 60);
// Display hours with up to 2 decimal places, stripping trailing zeros (0.25 → "0.25", 5.0 → "5")
const fmtHrs = h => parseFloat(h.toFixed(2)).toString();

// ----- Style tokens --------------------------------------------------------

const s = {
  root: { fontFamily: "system-ui, -apple-system, sans-serif", minHeight: "100vh", background: "#f9fafb" },
  nav: { background: "white", borderBottom: "1px solid #e5e7eb", padding: "0 20px", position: "sticky", top: 0, zIndex: 10 },
  navInner: { maxWidth: 940, margin: "0 auto", display: "flex", alignItems: "center" },
  brand: { padding: "12px 0", marginRight: 24 },
  brandName: { fontSize: 15, fontWeight: 600, color: "#111827", letterSpacing: "-0.01em" },
  brandSub: { fontSize: 10, color: "#9ca3af", letterSpacing: "0.07em", marginTop: 1 },
  tab: a => ({
    padding: "14px 14px", background: "none", border: "none",
    borderBottom: a ? "2px solid #4f46e5" : "2px solid transparent",
    color: a ? "#4f46e5" : "#6b7280", fontSize: 13, fontWeight: a ? 500 : 400,
    cursor: "pointer", transition: "all 0.12s", whiteSpace: "nowrap"
  }),
  main: { maxWidth: 940, margin: "0 auto", padding: "20px" },
  card: { background: "white", border: "1px solid #e5e7eb", borderRadius: 10, padding: "18px 20px" },
  label: { fontSize: 11, fontWeight: 500, color: "#6b7280", letterSpacing: "0.06em", marginBottom: 5, display: "block" },
  input: { width: "100%", border: "1px solid #d1d5db", borderRadius: 6, padding: "8px 10px", fontSize: 13, color: "#111827", background: "white", boxSizing: "border-box", outline: "none" },
  btnPrimary: bg => ({ background: bg || "#4f46e5", color: "white", border: "none", borderRadius: 6, padding: "9px 18px", fontSize: 13, fontWeight: 500, cursor: "pointer" }),
  btnGhost: { background: "transparent", color: "#9ca3af", border: "1px solid #e5e7eb", borderRadius: 5, padding: "3px 8px", fontSize: 11, cursor: "pointer" },
  stat: { background: "#f9fafb", border: "1px solid #f3f4f6", borderRadius: 8, padding: "12px 14px", flex: 1 },
  statNum: { fontSize: 22, fontWeight: 600, color: "#111827", lineHeight: 1 },
  statLabel: { fontSize: 11, color: "#9ca3af", marginTop: 4 },
};

// ----- Storage layer (File System Access API + localStorage fallback) ------
// File System Access API is Chromium-only. Safari/Firefox fall back to
// localStorage automatically — no setup required on those browsers.

const FS_SUPPORTED = typeof window.showDirectoryPicker === "function";

const IDB_NAME = "tk_fs_v1";
const IDB_STORE = "handles";

const openIDB = () => new Promise((resolve, reject) => {
  const req = indexedDB.open(IDB_NAME, 1);
  req.onupgradeneeded = e => e.target.result.createObjectStore(IDB_STORE);
  req.onsuccess = e => resolve(e.target.result);
  req.onerror = () => reject(req.error);
});

const getStoredHandle = async () => {
  try {
    const db = await openIDB();
    return await new Promise(resolve => {
      const req = db.transaction(IDB_STORE).objectStore(IDB_STORE).get("dir");
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => resolve(null);
    });
  } catch { return null; }
};

const storeHandle = async handle => {
  try {
    const db = await openIDB();
    await new Promise((resolve, reject) => {
      const req = db.transaction(IDB_STORE, "readwrite").objectStore(IDB_STORE).put(handle, "dir");
      req.onsuccess = resolve;
      req.onerror = () => reject(req.error);
    });
  } catch { /* non-fatal */ }
};

const verifyPermission = async handle => {
  const opts = { mode: "readwrite" };
  if (await handle.queryPermission(opts) === "granted") return true;
  if (await handle.requestPermission(opts) === "granted") return true;
  return false;
};

// Mount-time check only — requestPermission requires a user gesture and will
// silently fail if called during page load. Use this on startup; use
// verifyPermission (which calls requestPermission) only from a click handler.
const checkPermissionOnly = async handle => {
  try {
    return await handle.queryPermission({ mode: "readwrite" }) === "granted";
  } catch { return false; }
};

const readDataFile = async dirHandle => {
  try {
    const fh = await dirHandle.getFileHandle("data.json");
    const file = await fh.getFile();
    return JSON.parse(await file.text());
  } catch (e) {
    if (e.name === "NotFoundError") return null;
    throw e;
  }
};

const writeDataFile = async (dirHandle, data) => {
  const fh = await dirHandle.getFileHandle("data.json", { create: true });
  const writable = await fh.createWritable();
  await writable.write(JSON.stringify(data, null, 2));
  await writable.close();
};

// One-time migration: read whatever is in localStorage and return it as a data object.
const readLocalStorage = () => {
  try {
    const rawP = localStorage.getItem(STORAGE_KEYS.projects);
    let projects = rawP ? JSON.parse(rawP) : [];
    if (!projects.some(p => p.id === NONBILLABLE_ID)) projects.push(NONBILLABLE_DEFAULT);
    for (const def of OVERHEAD_DEFAULTS) {
      if (!projects.some(p => p.id === def.id)) projects.push(def);
    }
    const rawEntries = JSON.parse(localStorage.getItem(STORAGE_KEYS.entries) || "[]");
    const dayCursor = {};
    const entries = rawEntries.map(e => {
      if (typeof e.startMinutes === "number") return e;
      const cur = dayCursor[e.date] ?? 9 * 60;
      dayCursor[e.date] = cur + hoursToMin(e.hours || 0);
      return { ...e, startMinutes: cur };
    });
    const rawR = localStorage.getItem(RANGE_STORAGE_KEY);
    const timelineRange = rawR ? JSON.parse(rawR) : {};
    return { projects, entries, timelineRange };
  } catch {
    return { projects: [...OVERHEAD_DEFAULTS, NONBILLABLE_DEFAULT], entries: [], timelineRange: {} };
  }
};

const clearLocalStorage = () => {
  [STORAGE_KEYS.projects, STORAGE_KEYS.entries, RANGE_STORAGE_KEY].forEach(k => localStorage.removeItem(k));
};

// Seed required protected projects and backfill legacy entry fields.
const processLoadedData = data => {
  let { projects = [], entries = [], timelineRange = {} } = data;
  if (!projects.some(p => p.id === NONBILLABLE_ID)) projects = [...projects, NONBILLABLE_DEFAULT];
  for (const def of OVERHEAD_DEFAULTS) {
    if (!projects.some(p => p.id === def.id)) projects = [...projects, def];
  }
  const dayCursor = {};
  entries = entries.map(e => {
    if (typeof e.startMinutes === "number") return e;
    const cur = dayCursor[e.date] ?? 9 * 60;
    dayCursor[e.date] = cur + hoursToMin(e.hours || 0);
    return { ...e, startMinutes: cur };
  });
  return { projects, entries, timelineRange };
};

// ----- ProjectPicker -------------------------------------------------------

function ProjectPicker({ projects, value, onChange, placeholder = "— select project —", autoFocus }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);

  useEffect(() => {
    if (!open) return;
    const onClick = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", onClick);
    return () => document.removeEventListener("mousedown", onClick);
  }, [open]);

  const selected = projects.find(p => p.id === value);
  const billableProjects = projects.filter(p => p.billable !== false && !p.archived);
  const overheadProjects = projects.filter(p => p.overhead === true && !p.archived);
  const offsheetProjects = projects.filter(p => p.billable === false && !p.overhead && !p.archived);

  return (
    <div ref={ref} style={{ position: "relative" }}>
      <button type="button" autoFocus={autoFocus} onClick={() => setOpen(o => !o)}
        style={{ ...s.input, textAlign: "left", display: "flex", alignItems: "center", gap: 8, cursor: "pointer", height: 36 }}>
        {selected ? (
          <>
            <span style={{
              width: 10, height: 10, borderRadius: "50%", background: selected.color, flexShrink: 0,
              border: selected.billable === false ? "1px dashed #6b7280" : "none"
            }} />
            <span style={{ flex: 1, color: "#111827" }}>{selected.name}</span>
            {selected.code && <span style={{ fontSize: 11, color: "#9ca3af", fontFamily: "monospace" }}>{selected.code}</span>}
            {selected.billable === false && (
              <span style={{ fontSize: 10, color: "#6b7280", background: "#f1f5f9", padding: "1px 6px", borderRadius: 3 }}>
                {selected.overhead ? (OVERHEAD_BADGE[selected.id] || "OH") : "NB"}
              </span>
            )}
          </>
        ) : (
          <span style={{ flex: 1, color: "#9ca3af" }}>{placeholder}</span>
        )}
        <span style={{ color: "#9ca3af", fontSize: 10 }}>▼</span>
      </button>
      {open && (
        <div style={{
          position: "absolute", top: "calc(100% + 4px)", left: 0, right: 0, background: "white",
          border: "1px solid #e5e7eb", borderRadius: 6, boxShadow: "0 4px 16px rgba(15,23,42,0.08)",
          maxHeight: 280, overflowY: "auto", zIndex: 50
        }}>
          {billableProjects.length === 0 && (
            <div style={{ padding: "10px 12px", fontSize: 12, color: "#9ca3af" }}>No billable projects yet — add one in the Projects tab.</div>
          )}
          {billableProjects.map(p => (
            <ProjectOption key={p.id} project={p} onSelect={() => { onChange(p.id); setOpen(false); }} />
          ))}
          {overheadProjects.length > 0 && (
            <>
              <div style={{ borderTop: "1px solid #f3f4f6", padding: "3px 12px", fontSize: 10, color: "#9ca3af", letterSpacing: "0.05em" }}>OVERHEAD</div>
              {overheadProjects.map(p => (
                <ProjectOption key={p.id} project={p} onSelect={() => { onChange(p.id); setOpen(false); }} />
              ))}
            </>
          )}
          {offsheetProjects.length > 0 && (
            <>
              <div style={{ borderTop: "1px solid #f3f4f6", padding: "3px 12px", fontSize: 10, color: "#9ca3af", letterSpacing: "0.05em" }}>NON-BILLABLE</div>
              {offsheetProjects.map(p => (
                <ProjectOption key={p.id} project={p} onSelect={() => { onChange(p.id); setOpen(false); }} />
              ))}
            </>
          )}
        </div>
      )}
    </div>
  );
}

function ProjectOption({ project, onSelect }) {
  return (
    <div className="tk-picker-option" onClick={onSelect}
      style={{ padding: "8px 12px", display: "flex", alignItems: "center", gap: 8, cursor: "pointer", fontSize: 13 }}>
      <span style={{
        width: 12, height: 12, borderRadius: "50%", background: project.color, flexShrink: 0,
        border: project.billable === false ? "1px dashed #6b7280" : "none"
      }} />
      <span style={{ flex: 1, color: "#111827" }}>{project.name}</span>
      {project.code && <span style={{ fontSize: 11, color: "#9ca3af", fontFamily: "monospace" }}>{project.code}</span>}
      {project.billable === false && (
        <span style={{ fontSize: 10, color: "#6b7280", background: "#f1f5f9", padding: "1px 6px", borderRadius: 3 }}>
          {project.overhead ? (OVERHEAD_BADGE[project.id] || "OH") : "NB"}
        </span>
      )}
    </div>
  );
}

// ----- DayTimeline ---------------------------------------------------------
// Vertical 7am–7pm timeline, daytimer-style. Click the start hour, drag down for duration.
// Existing entries render as colored blocks at their start time. The pending block (during
// drag AND while the entry-creation modal is open) stays visible until confirm/cancel.

function DayTimeline({ dayEntries, projects, pending, onDragComplete, onEntryDelete, onEntryEdit, range, setRange }) {
  const ref = useRef(null);
  const [drag, setDrag] = useState(null);
  const [hoverMin, setHoverMin] = useState(null);

  const effStart = range.extendedStart ? 0 : DEFAULT_START_HOUR;
  const effEnd = range.extendedEnd ? 24 : DEFAULT_END_HOUR;
  const totalPx = (effEnd - effStart) * HOUR_PX;
  const hourCount = effEnd - effStart;

  const projMap = useMemo(() => Object.fromEntries(projects.map(p => [p.id, p])), [projects]);

  const yToMin = useCallback(y => {
    if (!ref.current) return effStart * 60;
    const rect = ref.current.getBoundingClientRect();
    const relY = Math.max(0, Math.min(totalPx, y - rect.top));
    return effStart * 60 + (relY / HOUR_PX) * 60;
  }, [effStart, totalPx]);

  useEffect(() => {
    if (!drag) return;
    const onMove = e => {
      const y = e.touches ? e.touches[0].clientY : e.clientY;
      const m = snapMin(yToMin(y));
      setDrag(d => ({ ...d, currentMin: Math.max(d.startMin + MIN_SNAP, Math.min(effEnd * 60, m)) }));
    };
    const onUp = () => {
      setDrag(d => {
        if (d) {
          const dur = d.currentMin - d.startMin;
          if (dur >= MIN_SNAP) onDragComplete({ startMin: d.startMin, durationMin: dur });
        }
        return null;
      });
    };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
    window.addEventListener("touchmove", onMove);
    window.addEventListener("touchend", onUp);
    return () => {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
      window.removeEventListener("touchmove", onMove);
      window.removeEventListener("touchend", onUp);
    };
  }, [drag, yToMin, onDragComplete, effEnd]);

  const onDown = e => {
    if (e.button !== undefined && e.button !== 0) return;
    const y = e.touches ? e.touches[0].clientY : e.clientY;
    const m = snapMin(yToMin(y));
    setDrag({ startMin: m, currentMin: m + MIN_SNAP });
    setHoverMin(null);
    e.preventDefault();
  };

  // Live drag wins over pending (which is the post-mouseup placeholder while modal is open).
  const ghost = drag
    ? { startMin: drag.startMin, durationMin: drag.currentMin - drag.startMin, source: "drag" }
    : pending
      ? { startMin: pending.startMin, durationMin: pending.durationMin, source: "pending" }
      : null;

  const totalLogged = dayEntries.reduce((sum, e) => sum + e.hours, 0);

  // Reusable styles for the extension toggles (top + bottom).
  const toggleBtn = {
    background: "transparent", color: "#6b7280", border: "1px dashed #d1d5db",
    borderRadius: 5, padding: "3px 12px", fontSize: 11, cursor: "pointer",
    fontFamily: "system-ui, -apple-system, sans-serif"
  };

  return (
    <div style={{ ...s.card, padding: "14px 14px 14px 8px" }}>
      <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 10, paddingLeft: 56 }}>
        <div style={{ fontSize: 11, fontWeight: 500, color: "#6b7280", letterSpacing: "0.06em" }}>DAY TIMELINE</div>
        <div style={{ fontSize: 12, color: "#6b7280" }}>
          <span style={{ fontFamily: "monospace", color: "#111827", fontWeight: 600 }}>{totalLogged.toFixed(2)}h</span>
          {" / "}
          <span style={{ fontFamily: "monospace" }}>{TARGET_HOURS}h target</span>
          {ghost && ghost.durationMin > 0 && (
            <span style={{ marginLeft: 12, color: "#4f46e5" }}>
              + <span style={{ fontFamily: "monospace", fontWeight: 600 }}>{(ghost.durationMin / 60).toFixed(2)}h</span>
              {" "}
              {ghost.source === "drag" ? "dragging" : "pending"}
            </span>
          )}
        </div>
      </div>

      {/* Top toggle — extend before 7am to midnight */}
      <div style={{ display: "flex", justifyContent: "center", marginBottom: 6, paddingLeft: 56 }}>
        <button onClick={() => setRange(r => ({ ...r, extendedStart: !r.extendedStart }))} style={toggleBtn}>
          {range.extendedStart ? "↓ Collapse to 7 AM" : "↑ Extend to midnight"}
        </button>
      </div>

      {/* Timeline body: hour labels (left) + interactive area (right) */}
      <div style={{ display: "flex", alignItems: "stretch" }}>
        {/* Hour labels column */}
        <div style={{ width: 56, position: "relative", height: totalPx, flexShrink: 0 }}>
          {Array.from({ length: hourCount + 1 }, (_, i) => {
            const hour = effStart + i;
            const top = i * HOUR_PX;
            const displayHour = hour === 24 ? 12 : hour;
            const ampm = displayHour === 0 || displayHour === 24 ? "AM" : displayHour >= 12 ? "PM" : "AM";
            const h12 = displayHour === 0 ? 12 : ((displayHour + 11) % 12) + 1;
            return (
              <div key={hour} style={{
                position: "absolute", top: top - 7, right: 8,
                fontSize: 10, color: "#9ca3af", fontFamily: "monospace", textAlign: "right"
              }}>{h12}{ampm}</div>
            );
          })}
        </div>

        {/* Interactive timeline area */}
        <div
          ref={ref}
          className={"tk-timeline" + (drag ? " tk-dragging" : "")}
          onMouseDown={onDown}
          onTouchStart={onDown}
          onMouseMove={e => { if (!drag) setHoverMin(snapMin(yToMin(e.clientY))); }}
          onMouseLeave={() => setHoverMin(null)}
          style={{
            flex: 1, position: "relative", height: totalPx,
            background: "#fafafa", border: "1px solid #e5e7eb", borderRadius: 6, overflow: "hidden"
          }}>
          {/* Hour gridlines */}
          {Array.from({ length: hourCount + 1 }, (_, i) => (
            <div key={i} style={{
              position: "absolute", left: 0, right: 0, top: i * HOUR_PX, height: 1,
              background: i === 0 ? "transparent" : "#f3f4f6", pointerEvents: "none"
            }} />
          ))}
          {/* Quarter-hour ticks: at :15, :30, :45 per hour */}
          {Array.from({ length: hourCount }, (_, i) =>
            [1, 2, 3].map(q => (
              <div key={`q-${i}-${q}`} style={{
                position: "absolute", left: 0,
                width: q === 2 ? 12 : 6,
                top: i * HOUR_PX + q * (HOUR_PX / 4), height: 1,
                background: q === 2 ? "#e5e7eb" : "#f0f0f0",
                pointerEvents: "none"
              }} />
            ))
          ).flat()}

          {/* Hover block — 15-min shaded region showing where drag will start */}
          {hoverMin !== null && !drag && !pending && (
            <>
              <div style={{
                position: "absolute", left: 0, right: 0,
                top: ((hoverMin - effStart * 60) / 60) * HOUR_PX,
                height: HOUR_PX / 4,
                background: "rgba(79,70,229,0.1)",
                borderTop: "1px solid rgba(79,70,229,0.35)",
                pointerEvents: "none",
              }} />
              <div style={{
                position: "absolute", left: 3, pointerEvents: "none",
                top: ((hoverMin - effStart * 60) / 60) * HOUR_PX + 2,
                fontSize: 9, fontFamily: "monospace", color: "#4f46e5",
                background: "rgba(255,255,255,0.85)", padding: "0 2px",
                borderRadius: 2, lineHeight: "11px",
              }}>{minToDisplay(hoverMin)}</div>
            </>
          )}

          {/* Existing entries */}
          {dayEntries.map(entry => {
            const proj = projMap[entry.projectId];
            if (!proj) return null;
            const top = ((entry.startMinutes - effStart * 60) / 60) * HOUR_PX;
            const height = entry.hours * HOUR_PX;
            const isNB = proj.billable === false;
            const endMin = entry.startMinutes + hoursToMin(entry.hours);
            // Tier the layout density to the block height.
            const showTimeRow = height >= 32;   // 30 min and up
            const showNote = height >= 48;       // 45 min and up
            const codes = [proj.code, proj.serviceCode, proj.taskCode].filter(Boolean).join(" · ");
            const tooltip = `${proj.name}${codes ? " — " + codes : ""}\n${minToDisplay(entry.startMinutes)} → ${minToDisplay(endMin)} · ${entry.hours.toFixed(2)}h${entry.note ? "\n\n" + entry.note : ""}${isNB ? "\n[non-billable]" : ""}`;
            return (
              <div key={entry.id} className="tk-entry-block" title={tooltip + "\n\nDouble-click to edit"} style={{
                position: "absolute", top, height, left: 4, right: 4,
                background: proj.color + "22",
                borderLeft: `3px ${isNB ? "dashed" : "solid"} ${proj.color}`,
                borderRadius: "0 6px 6px 0",
                padding: "1px 6px",
                overflow: "hidden",
                cursor: "default",
              }} onMouseDown={e => e.stopPropagation()}
                 onDoubleClick={() => onEntryEdit(entry)}>
                {/* Top line: project name · time range · hours */}
                <div style={{ display: "flex", alignItems: "baseline", gap: 6, lineHeight: 1.15 }}>
                  <span style={{ fontWeight: 500, color: proj.color, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", fontSize: 11, flex: "1 1 auto", minWidth: 0 }}>
                    {proj.name}
                  </span>
                  <span style={{ fontFamily: "monospace", fontSize: 9, color: "#9ca3af", flexShrink: 0, whiteSpace: "nowrap" }}>
                    {minToShort(entry.startMinutes)}–{minToShort(endMin)}
                  </span>
                  <span style={{ fontFamily: "monospace", fontSize: 10, color: "#374151", flexShrink: 0, fontWeight: 600 }}>
                    {entry.hours.toFixed(2)}h
                  </span>
                </div>
                {/* Note (if there's room) */}
                {showNote && entry.note && (
                  <div style={{
                    color: "#374151", marginTop: 2, lineHeight: 1.3, fontSize: 11,
                    overflow: "hidden", display: "-webkit-box",
                    WebkitLineClamp: Math.max(1, Math.floor((height - 24) / 14)),
                    WebkitBoxOrient: "vertical"
                  }}>
                    {entry.note}
                  </div>
                )}
                {/* Non-billable tag (only when there's room) */}
                {showTimeRow && isNB && !entry.note && (
                  <div style={{ fontSize: 9, color: "#94a3b8", fontFamily: "monospace", marginTop: 1 }}>non-billable</div>
                )}
                <button className="tk-delete-btn" title="Edit"
                  onClick={() => onEntryEdit(entry)}
                  onMouseDown={e => e.stopPropagation()}
                  style={{
                    position: "absolute", top: 2, right: 20,
                    width: 16, height: 16, borderRadius: 3, border: "none",
                    background: "rgba(255,255,255,0.85)", color: "#4f46e5",
                    fontSize: 11, cursor: "pointer", lineHeight: 1, padding: 0
                  }}>✎</button>
                <button className="tk-delete-btn" title="Delete"
                  onClick={() => onEntryDelete(entry.id)}
                  onMouseDown={e => e.stopPropagation()}
                  style={{
                    position: "absolute", top: 2, right: 2,
                    width: 16, height: 16, borderRadius: 3, border: "none",
                    background: "rgba(255,255,255,0.85)", color: "#6b7280",
                    fontSize: 10, cursor: "pointer", lineHeight: 1, padding: 0
                  }}>✕</button>
              </div>
            );
          })}

          {/* Ghost block (drag preview or pending-during-modal) */}
          {ghost && ghost.durationMin > 0 && (
            <div style={{
              position: "absolute",
              top: ((ghost.startMin - effStart * 60) / 60) * HOUR_PX,
              height: (ghost.durationMin / 60) * HOUR_PX,
              left: 4, right: 4,
              background: "repeating-linear-gradient(135deg, rgba(79,70,229,0.18), rgba(79,70,229,0.18) 6px, rgba(79,70,229,0.32) 6px, rgba(79,70,229,0.32) 12px)",
              borderLeft: "3px solid #4f46e5",
              borderRadius: "0 6px 6px 0",
              pointerEvents: "none",
              padding: "2px 6px",
              fontSize: 11, color: "#3730a3",
              boxShadow: ghost.source === "pending" ? "0 0 0 2px rgba(79,70,229,0.25)" : "none",
            }}>
              <div style={{ fontWeight: 600 }}>
                {minToDisplay(ghost.startMin)} → {minToDisplay(ghost.startMin + ghost.durationMin)}
              </div>
              <div style={{ fontFamily: "monospace" }}>
                {(ghost.durationMin / 60).toFixed(2)}h{ghost.source === "pending" ? " · awaiting details…" : ""}
              </div>
            </div>
          )}
        </div>
      </div>

      {/* Bottom toggle — extend after 7pm to midnight */}
      <div style={{ display: "flex", justifyContent: "center", marginTop: 6, paddingLeft: 56 }}>
        <button onClick={() => setRange(r => ({ ...r, extendedEnd: !r.extendedEnd }))} style={toggleBtn}>
          {range.extendedEnd ? "↑ Collapse to 7 PM" : "↓ Extend to midnight"}
        </button>
      </div>

      <div style={{ marginTop: 8, fontSize: 11, color: "#9ca3af", textAlign: "center" }}>
        {drag ? "Release to add this entry…" :
         pending ? "Fill in the details in the dialog…" :
         dayEntries.length === 0 ? "Click your start time and drag down to log an entry →" :
         "Click and drag inside the timeline to log another entry →"}
      </div>
    </div>
  );
}

function EntryModal({ initial, projects, date, onConfirm, onCancel }) {
  const [startTime, setStartTime] = useState(minToHHMM(initial.startMin));
  const [hours, setHours] = useState((initial.durationMin / 60).toFixed(2));
  const [projectId, setProjectId] = useState(initial.projectId || "");
  const [note, setNote] = useState(initial.note || "");
  const isEdit = !!initial.entryId;

  useEffect(() => {
    const onKey = e => { if (e.key === "Escape") onCancel(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onCancel]);

  const submit = () => {
    const h = parseFloat(hours);
    const startMin = hhmmToMin(startTime);
    if (!projectId || isNaN(h) || h <= 0 || isNaN(startMin)) return;
    onConfirm({ startMin, hours: h, projectId, note: note.trim() });
  };

  const canSubmit = !!projectId && !isNaN(parseFloat(hours)) && parseFloat(hours) > 0 && !!startTime;

  return (
    <div className="tk-backdrop" onClick={onCancel}>
      <div onClick={e => e.stopPropagation()} style={{
        background: "white", borderRadius: 10, padding: "20px 22px", width: 460, maxWidth: "92vw",
        boxShadow: "0 20px 60px rgba(15,23,42,0.25)"
      }}>
        <div style={{ fontSize: 11, fontWeight: 500, color: "#9ca3af", letterSpacing: "0.07em", marginBottom: 4 }}>{isEdit ? "EDIT ENTRY" : "NEW ENTRY"}</div>
        <div style={{ fontSize: 16, fontWeight: 600, color: "#111827", marginBottom: 16 }}>
          {dispDateLong(date)}
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 12 }}>
          <div>
            <label style={s.label}>START TIME</label>
            <input type="time" value={startTime} onChange={e => setStartTime(e.target.value)}
              style={{ ...s.input, fontFamily: "monospace", fontSize: 14, fontWeight: 600 }} />
          </div>
          <div>
            <label style={s.label}>DURATION (HOURS)</label>
            <input type="number" step="0.25" min="0.25" max="24" value={hours}
              onChange={e => setHours(e.target.value)}
              style={{ ...s.input, fontFamily: "monospace", fontSize: 14, fontWeight: 600, textAlign: "right" }} />
          </div>
        </div>

        <div style={{ marginBottom: 12 }}>
          <label style={s.label}>PROJECT</label>
          <ProjectPicker projects={projects} value={projectId} onChange={setProjectId} autoFocus={!isEdit} />
        </div>

        <div style={{ marginBottom: 18 }}>
          <label style={s.label}>NOTE</label>
          <input type="text" value={note} onChange={e => setNote(e.target.value)}
            onKeyDown={e => e.key === "Enter" && canSubmit && submit()}
            placeholder="e.g. drafted wireframes, client review call, fixed auth bug"
            style={s.input} />
        </div>

        <div style={{ display: "flex", justifyContent: "flex-end", gap: 8 }}>
          <button onClick={onCancel} style={{
            background: "transparent", color: "#6b7280", border: "1px solid #e5e7eb",
            borderRadius: 6, padding: "9px 16px", fontSize: 13, cursor: "pointer"
          }}>Cancel</button>
          <button onClick={submit} disabled={!canSubmit} style={{
            ...s.btnPrimary(), opacity: canSubmit ? 1 : 0.5, cursor: canSubmit ? "pointer" : "not-allowed"
          }}>{isEdit ? "Save changes" : "Add entry"}</button>
        </div>
      </div>
    </div>
  );
}

// ----- Main App ------------------------------------------------------------

function App() {
  const [status, setStatus] = useState("loading"); // "loading" | "needs-folder" | "needs-permission" | "ready"
  const [dirHandle, setDirHandle] = useState(null);
  const [pendingHandle, setPendingHandle] = useState(null); // stored handle awaiting permission re-grant
  const [projects, setProjects] = useState([]);
  const [entries, setEntries] = useState([]);
  const [tab, setTab] = useState("log");

  const [selectedDay, setSelectedDay] = useState(todayStr());
  const [filterMonth, setFilterMonth] = useState(todayStr().slice(0, 7));

  // pending = post-drag, pre-confirm placeholder. Drives both the modal AND the ghost block.
  const [pending, setPending] = useState(null); // { startMin, durationMin } | null

  const [showPF, setShowPF] = useState(false);
  const [showArchived, setShowArchived] = useState(false);
  const [pName, setPName] = useState("");
  const [pCode, setPCode] = useState("");
  const [pColor, setPColor] = useState(PALETTE[0]);

  const [editingProjectId, setEditingProjectId] = useState(null);
  const [editPName, setEditPName] = useState("");
  const [editPCode, setEditPCode] = useState("");
  const [editPColor, setEditPColor] = useState(PALETTE[0]);

  const [xMonth, setXMonth] = useState(todayStr().slice(0, 7));

  const [editing, setEditing] = useState(null); // entry being edited | null

  const [timelineRange, setTimelineRange] = useState({});

  const initialized = useRef(false);
  const restoreInputRef = useRef(null);

  // On mount: load data from file (Chromium) or localStorage (Safari/Firefox).
  useEffect(() => {
    (async () => {
      if (!FS_SUPPORTED) {
        // localStorage path — works in any browser
        const { projects: ps, entries: es, timelineRange: tr } = processLoadedData(readLocalStorage());
        setProjects(ps);
        setEntries(es);
        setTimelineRange(tr);
        initialized.current = true;
        setStatus("ready");
        return;
      }
      // File System API path — Chromium only
      try {
        const handle = await getStoredHandle();
        if (handle) {
          if (await checkPermissionOnly(handle)) {
            // Permission still active (same browser session) — load immediately.
            const raw = await readDataFile(handle) || readLocalStorage();
            const { projects: ps, entries: es, timelineRange: tr } = processLoadedData(raw);
            setProjects(ps);
            setEntries(es);
            setTimelineRange(tr);
            setDirHandle(handle);
            initialized.current = true;
            setStatus("ready");
            return;
          }
          // Handle found but permission lapsed (typical after browser restart).
          // Store the handle and ask the user to click to re-grant — requestPermission
          // requires a user gesture and cannot be called here on mount.
          setPendingHandle(handle);
          setStatus("needs-permission");
          return;
        }
      } catch (e) {
        console.error("Timekeeper load error:", e);
      }
      setStatus("needs-folder");
    })();
  }, []);

  // Save on every data change — file (Chromium) or localStorage (fallback).
  useEffect(() => {
    if (!initialized.current) return;
    if (!FS_SUPPORTED || !dirHandle) {
      // localStorage fallback
      try {
        localStorage.setItem(STORAGE_KEYS.projects, JSON.stringify(projects));
        localStorage.setItem(STORAGE_KEYS.entries, JSON.stringify(entries));
        localStorage.setItem(RANGE_STORAGE_KEY, JSON.stringify(timelineRange));
      } catch (e) { console.error("Timekeeper localStorage save error:", e); }
      return;
    }
    const id = setTimeout(() => {
      writeDataFile(dirHandle, { projects, entries, timelineRange })
        .catch(e => console.error("Timekeeper save error:", e));
    }, 400);
    return () => clearTimeout(id);
  }, [projects, entries, timelineRange, dirHandle]);

  const projMap = useMemo(() => Object.fromEntries(projects.map(p => [p.id, p])), [projects]);

  const dayEntries = useMemo(
    () => entries
      .filter(e => e.date === selectedDay)
      .sort((a, b) => a.startMinutes - b.startMinutes),
    [entries, selectedDay]
  );

  const handleDragComplete = useCallback(p => setPending(p), []);

  const autoExtendRange = (startMin, hours) => {
    const effS = timelineRange.extendedStart ? 0 : DEFAULT_START_HOUR;
    const effE = timelineRange.extendedEnd ? 24 : DEFAULT_END_HOUR;
    if (startMin < effS * 60) setTimelineRange(r => ({ ...r, extendedStart: true }));
    if (startMin + hoursToMin(hours) > effE * 60) setTimelineRange(r => ({ ...r, extendedEnd: true }));
  };

  const confirmEntry = ({ startMin, hours, projectId, note }) => {
    setEntries(prev => [
      { id: Date.now().toString(), date: selectedDay, projectId, hours,
        startMinutes: startMin, note },
      ...prev
    ]);
    setPending(null);
    autoExtendRange(startMin, hours);
  };

  const cancelEntry = () => setPending(null);

  const deleteEntry = id => setEntries(prev => prev.filter(e => e.id !== id));

  const openEdit = entry => setEditing(entry);
  const cancelEdit = () => setEditing(null);
  const updateEntry = ({ startMin, hours, projectId, note }) => {
    setEntries(prev => prev.map(e => e.id === editing.id
      ? { ...e, startMinutes: startMin, hours, projectId, note }
      : e));
    if (editing.date === selectedDay) autoExtendRange(startMin, hours);
    setEditing(null);
  };

  const backupData = () => {
    const blob = new Blob(
      [JSON.stringify({ projects, entries, timelineRange }, null, 2)],
      { type: "application/json" }
    );
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `timekeeper_backup_${todayStr()}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const restoreData = e => {
    const file = e.target.files[0];
    if (!file) return;
    e.target.value = "";
    if (!window.confirm(`Replace all current data with the contents of "${file.name}"? This cannot be undone.`)) return;
    const reader = new FileReader();
    reader.onload = evt => {
      try {
        const raw = JSON.parse(evt.target.result);
        const { projects: ps, entries: es, timelineRange: tr } = processLoadedData(raw);
        setProjects(ps);
        setEntries(es);
        setTimelineRange(tr);
      } catch {
        alert("Could not read that file — make sure it's a valid Timekeeper backup.");
      }
    };
    reader.readAsText(file);
  };

  const reconnect = async () => {
    if (!pendingHandle) return;
    try {
      const ok = await verifyPermission(pendingHandle);
      if (ok) {
        const raw = await readDataFile(pendingHandle) || readLocalStorage();
        const { projects: ps, entries: es, timelineRange: tr } = processLoadedData(raw);
        setProjects(ps);
        setEntries(es);
        setTimelineRange(tr);
        setDirHandle(pendingHandle);
        setPendingHandle(null);
        initialized.current = true;
        setStatus("ready");
      } else {
        setPendingHandle(null);
        setStatus("needs-folder");
      }
    } catch (e) {
      console.error("Reconnect error:", e);
      setPendingHandle(null);
      setStatus("needs-folder");
    }
  };

  const pickFolder = async () => {
    try {
      const startIn = pendingHandle || "documents";
      const handle = await window.showDirectoryPicker({ mode: "readwrite", startIn });
      await storeHandle(handle);
      const raw = await readDataFile(handle) || readLocalStorage();
      const { projects: ps, entries: es, timelineRange: tr } = processLoadedData(raw);
      await writeDataFile(handle, { projects: ps, entries: es, timelineRange: tr });
      clearLocalStorage();
      setProjects(ps);
      setEntries(es);
      setTimelineRange(tr);
      setDirHandle(handle);
      setPendingHandle(null);
      initialized.current = true;
      setStatus("ready");
    } catch (e) {
      if (e.name !== "AbortError") alert("Could not access that folder. Please try again.");
    }
  };

  const saveProject = () => {
    if (!pName.trim()) return;
    setProjects(p => [...p, {
      id: Date.now().toString(), name: pName.trim(),
      code: pCode.trim(), color: pColor, billable: true
    }]);
    setPName(""); setPCode("");
    setPColor(PALETTE[(projects.length + 1) % PALETTE.length]);
    setShowPF(false);
  };

  const startEditProject = proj => {
    setEditingProjectId(proj.id);
    setEditPName(proj.name);
    setEditPCode(proj.code || "");
    setEditPColor(proj.color);
  };
  const saveEditProject = () => {
    if (!editPName.trim()) return;
    setProjects(p => p.map(x => x.id === editingProjectId
      ? { ...x, name: editPName.trim(), code: editPCode.trim(), color: editPColor }
      : x));
    setEditingProjectId(null);
  };

  const archiveProject = id => {
    setProjects(p => p.map(x => x.id === id ? { ...x, archived: true } : x));
    setEditingProjectId(null);
  };
  const restoreProject = id => setProjects(p => p.map(x => x.id === id ? { ...x, archived: false } : x));

  const deleteProject = id => {
    if (id === NONBILLABLE_ID || OVERHEAD_DEFAULTS.some(d => d.id === id)) return;
    setProjects(p => p.filter(x => x.id !== id));
    setEntries(p => p.filter(e => e.projectId !== id));
  };

  const thisMonth = selectedDay.slice(0, 7);
  const mAll = entries.filter(e => e.date.startsWith(thisMonth));
  const billableHours = mAll.filter(e => projMap[e.projectId]?.billable !== false).reduce((s, e) => s + e.hours, 0);
  const nonBillableHours = mAll.filter(e => projMap[e.projectId]?.billable === false).reduce((s, e) => s + e.hours, 0);

  const visibleEntries = entries.filter(e => e.date.startsWith(filterMonth));
  const grouped = visibleEntries.reduce((acc, e) => { (acc[e.date] = acc[e.date] || []).push(e); return acc; }, {});
  const sortedDates = Object.keys(grouped).sort((a, b) => b.localeCompare(a));
  const availableMonths = [...new Set(entries.map(e => e.date.slice(0, 7)))].sort((a, b) => b.localeCompare(a));
  if (!availableMonths.includes(thisMonth)) availableMonths.unshift(thisMonth);

  // ---- Monthly Excel export — one tab per week + Descriptions tab -----------
  const exportMonthly = () => {
    const weeks = getWeeksInMonth(xMonth);
    if (!weeks.length) { alert("No weeks found for that month."); return; }

    // Collect all billable entries whose week-ending Sunday falls in this month
    const billMonthEntries = entries.filter(e => {
      const p = projMap[e.projectId];
      if (!p || p.billable === false || p.archived) return false;
      return weeks.some(w => e.date >= w.mon && e.date <= w.sun);
    });
    if (!billMonthEntries.length) { alert("No billable entries for that month."); return; }

    const E = ""; const blank = n => Array(n).fill(E);
    const shortDate = s => new Date(s + "T12:00:00")
      .toLocaleDateString("en-US", { month: "short", day: "numeric" });

    const buildWeekSheet = ({ mon, sun }) => {
      const dates = weekDatesFrom(mon);
      const allWk = entries.filter(e => e.date >= mon && e.date <= sun);
      const billWk = allWk.filter(e => { const p = projMap[e.projectId]; return p && p.billable !== false && !p.archived; });
      const workWk = allWk.filter(e => { const p = projMap[e.projectId]; return p && !p.archived && (p.billable !== false || p.overhead === true); });
      const billProjects = projects.filter(p => p.billable !== false && !p.archived && billWk.some(e => e.projectId === p.id));

      const projDayHrs = (projId, date) =>
        allWk.filter(e => e.projectId === projId && e.date === date).reduce((s, e) => s + e.hours, 0);
      const projTotal = projId =>
        +dates.reduce((s, d) => s + projDayHrs(projId, d), 0).toFixed(2);

      const dayTotals = dates.map(d => workWk.filter(e => e.date === d).reduce((s, e) => s + e.hours, 0));
      const totalAll  = +workWk.reduce((s, e) => s + e.hours, 0).toFixed(2);
      const totalBill = +billWk.reduce((s, e) => s + e.hours, 0).toFixed(2);

      const weekEnd = new Date(sun + "T12:00:00").toLocaleDateString("en-US",
        { month: "long", day: "numeric", year: "numeric" });

      const aoa = [
        ["SEIBERT ARCHITECTS, P.A.", ...blank(9), "WEEKLY TIME SHEET", E, E],
        ["CONTRACTED SERVICES / CHANGE IN SERVICE     SERVICES: 2.1  -  2.3 -  2.4 (Tasks: SD,DD,CD)   2.5 -   2.6 - 2.8", ...blank(12)],
        ["OH - Overhead", ...blank(12)],
        [...blank(13)],
        ["Project / Client Name", "Job #", "Services", "Tasks", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun", "TOTAL", "Billable hours *"],
        ...billProjects.map(proj => {
          const dh = dates.map(d => projDayHrs(proj.id, d) || E);
          const tot = projTotal(proj.id);
          return [proj.name, proj.code || E, proj.serviceCode || E, proj.taskCode || E, ...dh, tot, tot];
        }),
        [E, E, E, E, ...blank(7), 0, 0],
        ...OVERHEAD_DEFAULTS.filter(oh => !projMap[oh.id]?.archived).map(oh => {
          const dh = dates.map(d => { const h = projDayHrs(oh.id, d); return h ? h : E; });
          const tot = projTotal(oh.id);
          return [OVERHEAD_EXCEL_LABEL[oh.id], E, E, E, ...dh, tot || 0, E];
        }),
        ["TOTAL HOURS WORKED", E, E, E, ...dayTotals.map(h => h || E), totalAll, totalBill],
        ["Mileage:",       E, E, "Hours To / From Time Bank", ...blank(9)],
        ["Tolls:",         E, E, "Vacation hours",            ...blank(9)],
        ["Reimbursables:", E, E, "Sick time",                 ...blank(9)],
        [E,                E, E, "Holiday",                   ...blank(9)],
        ["TOTAL HOURS TO BE PAID", ...blank(10), totalAll, E],
        [`NAME:   WILLIAM CRAIG`, ...blank(12)],
        [`WEEK ENDING: ${weekEnd}`, ...blank(11), "* Project Managers only"],
      ];

      const ws = XLSX.utils.aoa_to_sheet(aoa);
      ws["!cols"] = [
        { wch: 44 }, { wch: 8 }, { wch: 10 }, { wch: 8 },
        { wch: 5 }, { wch: 5 }, { wch: 5 }, { wch: 5 }, { wch: 5 }, { wch: 5 }, { wch: 5 },
        { wch: 8 }, { wch: 16 },
      ];
      return ws;
    };

    const buildDescriptionsSheet = () => {
      const weekEndingSunday = s => {
        const d = new Date(s + "T12:00:00");
        const day = d.getDay();
        d.setDate(d.getDate() + (day === 0 ? 0 : 7 - day));
        return fmtDate(d);
      };

      const used = projects.filter(p =>
        p.billable !== false && !p.archived && billMonthEntries.some(e => e.projectId === p.id)
      );

      const aoa = [];
      used.forEach((proj, idx) => {
        if (idx > 0) aoa.push([E]);
        aoa.push([proj.name + (proj.code ? `  |  Job #: ${proj.code}` : "")]);
        aoa.push(["week ending", "Descriptions"]);

        const pe = billMonthEntries.filter(e => e.projectId === proj.id)
          .sort((a, b) => a.date.localeCompare(b.date));

        const weekMap = {};
        pe.forEach(e => {
          const wk = weekEndingSunday(e.date);
          (weekMap[wk] = weekMap[wk] || []).push(e);
        });

        Object.keys(weekMap).sort().forEach(wk => {
          const lines = weekMap[wk].map(e => {
            return e.note ? `${shortDate(e.date)}: ${e.note}` : null;
          }).filter(Boolean).join("\n");
          aoa.push([shortDate(wk), lines || "(no notes)"]);
        });
      });

      const ws = XLSX.utils.aoa_to_sheet(aoa);
      ws["!cols"] = [{ wch: 14 }, { wch: 80 }];
      return ws;
    };

    const wb = XLSX.utils.book_new();

    weeks.forEach(({ mon, sun }) => {
      const ws = buildWeekSheet({ mon, sun });
      const label = shortDate(sun);
      XLSX.utils.book_append_sheet(wb, ws, `Wk ${label}`);
    });

    XLSX.utils.book_append_sheet(wb, buildDescriptionsSheet(), "Descriptions");

    XLSX.writeFile(wb, `TimeSheet_${xMonth}.xlsx`);
  };

  if (status === "loading") return (
    <div style={{ ...s.root, display: "flex", alignItems: "center", justifyContent: "center", minHeight: "100vh" }}>
      <div style={{ color: "#9ca3af", fontSize: 13 }}>Loading…</div>
    </div>
  );
  if (status === "needs-permission") return (
    <ReconnectScreen
      folderName={pendingHandle?.name || "your data folder"}
      onReconnect={reconnect}
      onPickNew={() => { setPendingHandle(null); setStatus("needs-folder"); }}
    />
  );
  if (status === "needs-folder") return <SetupScreen onPick={pickFolder} />;

  return (
    <div style={s.root}>
      <div style={s.nav}>
        <div style={s.navInner}>
          <div style={{ ...s.brand, display: "flex", alignItems: "center", gap: 10 }}>

                                  width: 116, flexShrink: 0, paddingTop: 2

                                  <span style={{ fontSize: 10 }}>→ {minToDisplay(entry.startMinutes + hoursToMin(entry.hours))}</span>

                          <button onClick={() => archiveProject(proj.id)} style={{
                            background: "transparent", color: "#9ca3af", border: "1px solid #e5e7eb",
                            borderRadius: 6, padding: "6px 14px", fontSize: 12, cursor: "pointer"
                          }}>Archive project</button>
                          <div style={{ fontSize: 11, color: "#9ca3af", marginTop: 4 }}>
                            Hides from picker and exports. All entries are preserved and can be restored later.
                          </div>
                        </div>
                      )}
                    </div>
                  );
                }

                return (
                  <div key={proj.id} style={{
                    ...s.card, display: "flex", alignItems: "center", gap: 12, padding: "12px 16px",
                    background: isNB ? "#fafafa" : "white"
                  }}>
                    <div style={{
                      width: 10, height: 10, borderRadius: "50%", background: proj.color, flexShrink: 0,
                      border: isNB ? "1px dashed #6b7280" : "none"
                    }} />
                    <div style={{ flex: 1 }}>
                      <span style={{ fontSize: 14, fontWeight: 500, color: "#111827" }}>{proj.name}</span>
                      {proj.code && <span style={{
                        fontSize: 11, color: "#9ca3af", fontFamily: "monospace", marginLeft: 8,
                        background: "#f3f4f6", padding: "1px 6px", borderRadius: 3
                      }}>{proj.code}</span>}
                      {proj.overhead && <span style={{
                        fontSize: 10, color: "#6b7280", background: "#f1f5f9", marginLeft: 8,
                        padding: "1px 6px", borderRadius: 3
                      }}>overhead · in weekly timesheet</span>}
                      {isNB && !proj.overhead && <span style={{
                        fontSize: 10, color: "#6b7280", background: "#f1f5f9", marginLeft: 8,
                        padding: "1px 6px", borderRadius: 3
                      }}>non-billable · excluded from all exports</span>}
                    </div>
                    <div style={{ fontSize: 12, color: "#9ca3af", textAlign: "right", lineHeight: 1.6 }}>
                      <div>{fmtHrs(hrs)}h total</div>
                      <div>{pe.length} entries</div>
                    </div>
                    <button onClick={() => startEditProject(proj)} style={s.btnGhost}>✎</button>
                    {proj.billable !== false && (
                      <button onClick={() => deleteProject(proj.id)} style={s.btnGhost}>✕</button>
                    )}
                  </div>
                );
              })}
            </div>

            {/* Archived projects */}
            {projects.some(p => p.archived) && (
              <div style={{ marginTop: 20 }}>
                <button onClick={() => setShowArchived(v => !v)} style={{
                  background: "none", border: "none", cursor: "pointer",
                  fontSize: 12, color: "#9ca3af", padding: "4px 0", display: "flex", alignItems: "center", gap: 6
                }}>
                  <span>{showArchived ? "▲" : "▼"}</span>
                  <span>Archived ({projects.filter(p => p.archived).length})</span>
                </button>
                {showArchived && (
                  <div style={{ display: "flex", flexDirection: "column", gap: 6, marginTop: 8 }}>
                    {projects.filter(p => p.archived).map(proj => {
                      const pe = entries.filter(e => e.projectId === proj.id);
                      const hrs = pe.reduce((s, e) => s + e.hours, 0);
                      return (
                        <div key={proj.id} style={{
                          ...s.card, display: "flex", alignItems: "center", gap: 12, padding: "12px 16px",
                          opacity: 0.6, background: "#f9fafb"
                        }}>
                          <div style={{ width: 10, height: 10, borderRadius: "50%", background: proj.color, flexShrink: 0 }} />
                          <div style={{ flex: 1 }}>
                            <span style={{ fontSize: 14, fontWeight: 500, color: "#374151" }}>{proj.name}</span>
                            {proj.code && <span style={{
                              fontSize: 11, color: "#9ca3af", fontFamily: "monospace", marginLeft: 8,
                              background: "#f3f4f6", padding: "1px 6px", borderRadius: 3
                            }}>{proj.code}</span>}
                          </div>
                          <div style={{ fontSize: 12, color: "#9ca3af", textAlign: "right", lineHeight: 1.6 }}>
                            <div>{fmtHrs(hrs)}h total</div>
                            <div>{pe.length} entries</div>
                          </div>
                          <button onClick={() => restoreProject(proj.id)} style={s.btnGhost}>Restore</button>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}
          </div>
        )}

        {tab === "export" && (
          <div>

            {/* ── Monthly export ── */}
            <div style={{ marginBottom: 14 }}>
              <div style={s.card}>
                <div style={{ fontSize: 10, fontWeight: 500, color: "#4f46e5", letterSpacing: "0.07em", marginBottom: 6 }}>MONTHLY TIMESHEET</div>
                <div style={{ fontSize: 15, fontWeight: 500, color: "#111827", marginBottom: 4 }}>Excel export</div>
                <div style={{ fontSize: 12, color: "#9ca3af", lineHeight: 1.6, marginBottom: 16 }}>
                  One tab per week (weeks defined by week-ending Sunday) plus a Descriptions tab with notes grouped by project and week.
                </div>
                <div style={{ marginBottom: 12 }}>
                  <label style={s.label}>BILLING MONTH</label>
                  <input type="month" value={xMonth} onChange={e => setXMonth(e.target.value)} style={s.input} />
                </div>
                <div style={{ fontSize: 12, color: "#9ca3af", marginBottom: 12 }}>
                  {(() => {
                    const weeks = getWeeksInMonth(xMonth);
                    const me = entries.filter(e => {
                      const p = projMap[e.projectId];
                      if (!p || p.billable === false || p.archived) return false;
                      return weeks.some(w => e.date >= w.mon && e.date <= w.sun);
                    });
                    const proj_count = new Set(me.map(e => e.projectId)).size;
                    return `${weeks.length} weeks · ${me.length} billable entries · ${fmtHrs(me.reduce((s, e) => s + e.hours, 0))}h · ${proj_count} projects`;
                  })()}
                </div>
                <button onClick={exportMonthly} style={{ ...s.btnPrimary("#4f46e5"), width: "100%" }}>↓ Download .xlsx</button>
              </div>
            </div>

          {/* ── Live preview ── */}
          {(() => {
            const previewMon  = getMonday(selectedDay);
            const previewSun  = offsetDay(previewMon, 6);
            const previewDates = weekDatesFrom(previewMon);
            const DAY_LABELS  = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
            const shortDate   = d => new Date(d + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" });
            const previewYM   = selectedDay.slice(0, 7);

            // Week data
            const weekEntries = entries.filter(e => e.date >= previewMon && e.date <= previewSun);
            const billProjects = projects.filter(p =>
              p.billable !== false && !p.archived && weekEntries.some(e => e.projectId === p.id)
            );
            const overheadProjs = OVERHEAD_DEFAULTS.filter(oh => !projMap[oh.id]?.archived);
            const projDayHrs = (projId, date) =>
              weekEntries.filter(e => e.projectId === projId && e.date === date).reduce((s, e) => s + e.hours, 0);
            const projWeekTotal = projId =>
              +previewDates.reduce((s, d) => s + projDayHrs(projId, d), 0).toFixed(2);
            const dayWorkedHrs = date =>
              weekEntries.filter(e => e.date === date && projMap[e.projectId] &&
                (projMap[e.projectId].billable !== false || projMap[e.projectId].overhead === true))
                .reduce((s, e) => s + e.hours, 0);
            const weekWorkedTotal = +weekEntries.filter(e => {
              const p = projMap[e.projectId];
              return p && !p.archived && (p.billable !== false || p.overhead === true);
            }).reduce((s, e) => s + e.hours, 0).toFixed(2);

            // Month descriptions data
            const monthWeeks = getWeeksInMonth(previewYM);
            const monthBillEntries = entries.filter(e => {
              const p = projMap[e.projectId];
              if (!p || p.billable === false || p.archived) return false;
              return monthWeeks.some(w => e.date >= w.mon && e.date <= w.sun);
            });
            const usedProjects = projects.filter(p =>
              p.billable !== false && !p.archived && monthBillEntries.some(e => e.projectId === p.id)
            );
            const weekEndingSunday = d => {
              const dt = new Date(d + "T12:00:00"), dow = dt.getDay();
              dt.setDate(dt.getDate() + (dow === 0 ? 0 : 7 - dow));
              return fmtDate(dt);
            };

            const thStyle = isActive => ({
              textAlign: "right", padding: "4px 6px",
              color: isActive ? "#4f46e5" : "#6b7280",
              fontWeight: isActive ? 700 : 500,
              fontSize: 11, borderBottom: "1px solid #e5e7eb", minWidth: 36
            });
            const numCell = (h, dim) => ({
              textAlign: "right", padding: "3px 6px",
              color: h > 0 ? (dim ? "#6b7280" : "#111827") : "#d1d5db",
              fontSize: dim ? 11 : 12, fontVariantNumeric: "tabular-nums"
            });

            return (
              <div style={{ ...s.card, marginTop: 14 }}>

                {/* ── Week table ── */}
                <div style={{ fontSize: 10, fontWeight: 500, color: "#9ca3af", letterSpacing: "0.07em", marginBottom: 10 }}>
                  WEEK PREVIEW &nbsp;·&nbsp; {shortDate(previewMon)} – {shortDate(previewSun)}
                </div>
                <div style={{ overflowX: "auto", marginBottom: 20 }}>
                  <table style={{ borderCollapse: "collapse", fontSize: 12, width: "100%" }}>
                    <thead>
                      <tr>
                        <th style={{ textAlign: "left", padding: "4px 8px 4px 0", color: "#6b7280", fontWeight: 500, fontSize: 11, borderBottom: "1px solid #e5e7eb" }}>Project</th>
                        {DAY_LABELS.map((lbl, i) => (
                          <th key={lbl} style={thStyle(previewDates[i] === selectedDay)}>{lbl}</th>
                        ))}
                        <th style={{ ...thStyle(false), minWidth: 44, color: "#374151", fontWeight: 600 }}>Total</th>
                      </tr>
                    </thead>
                    <tbody>
                      {billProjects.length === 0 && (
                        <tr><td colSpan={9} style={{ padding: "10px 0", color: "#9ca3af", fontSize: 12, fontStyle: "italic" }}>No billable entries this week.</td></tr>
                      )}
                      {billProjects.map(proj => (
                        <tr key={proj.id}>
                          <td style={{ padding: "3px 8px 3px 0", color: "#374151", fontSize: 12 }}>
                            <span style={{ display: "inline-block", width: 7, height: 7, borderRadius: "50%", background: proj.color, marginRight: 6 }} />
                            {proj.name}
                            {proj.code && <span style={{ color: "#9ca3af", fontFamily: "monospace", fontSize: 10, marginLeft: 6 }}>{proj.code}</span>}
                          </td>
                          {previewDates.map(d => {
                            const h = projDayHrs(proj.id, d);
                            return <td key={d} style={numCell(h, false)}>{h > 0 ? fmtHrs(h) : "—"}</td>;
                          })}
                          <td style={{ ...numCell(projWeekTotal(proj.id), false), fontWeight: 600 }}>{fmtHrs(projWeekTotal(proj.id))}</td>
                        </tr>
                      ))}
                      <tr><td colSpan={9} style={{ padding: "2px 0" }}><div style={{ borderTop: "1px dashed #e5e7eb" }} /></td></tr>
                      {overheadProjs.map(oh => {
                        const t = projWeekTotal(oh.id);
                        return (
                          <tr key={oh.id}>
                            <td style={{ padding: "3px 8px 3px 0", color: "#9ca3af", fontSize: 11 }}>{OVERHEAD_EXCEL_LABEL[oh.id]}</td>
                            {previewDates.map(d => {
                              const h = projDayHrs(oh.id, d);
                              return <td key={d} style={numCell(h, true)}>{h > 0 ? fmtHrs(h) : "—"}</td>;
                            })}
                            <td style={numCell(t, true)}>{t > 0 ? fmtHrs(t) : "—"}</td>
                          </tr>
                        );
                      })}
                      <tr>
                        <td style={{ padding: "4px 8px 4px 0", color: "#374151", fontWeight: 600, fontSize: 12, borderTop: "1px solid #e5e7eb" }}>TOTAL HOURS WORKED</td>
                        {previewDates.map(d => {
                          const h = dayWorkedHrs(d);
                          return <td key={d} style={{ ...numCell(h, false), fontWeight: 600, borderTop: "1px solid #e5e7eb" }}>{h > 0 ? fmtHrs(h) : "—"}</td>;
                        })}
                        <td style={{ ...numCell(weekWorkedTotal, false), fontWeight: 700, borderTop: "1px solid #e5e7eb" }}>{weekWorkedTotal > 0 ? fmtHrs(weekWorkedTotal) : "—"}</td>
                      </tr>
                    </tbody>
                  </table>
                </div>

                {/* ── Month descriptions ── */}
                <div style={{ fontSize: 10, fontWeight: 500, color: "#9ca3af", letterSpacing: "0.07em", marginBottom: 10, paddingTop: 14, borderTop: "1px solid #f3f4f6" }}>
                  DESCRIPTIONS PREVIEW &nbsp;·&nbsp; {new Date(previewYM + "-15").toLocaleDateString("en-US", { month: "long", year: "numeric" })}
                </div>
                {usedProjects.length === 0 ? (
                  <div style={{ color: "#9ca3af", fontSize: 12, fontStyle: "italic" }}>No billable entries this month.</div>
                ) : (
                  <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                    {usedProjects.map(proj => {
                      const pe = monthBillEntries.filter(e => e.projectId === proj.id)
                        .sort((a, b) => a.date.localeCompare(b.date));
                      const weekMap = {};
                      pe.forEach(e => { const wk = weekEndingSunday(e.date); (weekMap[wk] = weekMap[wk] || []).push(e); });
                      return (
                        <div key={proj.id}>
                          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 5 }}>
                            <div style={{ width: 8, height: 8, borderRadius: "50%", background: proj.color, flexShrink: 0 }} />
                            {proj.code && <span style={{ fontSize: 11, color: "#9ca3af", fontFamily: "monospace", background: "#f3f4f6", padding: "1px 6px", borderRadius: 3 }}>{proj.code}</span>}
                            <span style={{ fontSize: 13, fontWeight: 600, color: "#111827" }}>{proj.name}</span>
                          </div>
                          <div style={{ display: "flex", flexDirection: "column", gap: 3, paddingLeft: 16 }}>
                            {Object.keys(weekMap).sort().map(wk => (
                              <div key={wk} style={{ display: "flex", gap: 12, alignItems: "flex-start" }}>
                                <div style={{ fontSize: 11, color: "#9ca3af", whiteSpace: "nowrap", minWidth: 80, paddingTop: 1 }}>wk {shortDate(wk)}</div>
                                <div style={{ fontSize: 12, color: "#374151", lineHeight: 1.55 }}>
                                  {weekMap[wk].filter(e => e.note).map(e => e.note).join("; ") ||
                                    <span style={{ color: "#9ca3af", fontStyle: "italic" }}>no notes</span>}
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}

              </div>
            );
          })()}

          {/* Data storage */}
          <div style={{ ...s.card, marginTop: 14 }}>
            <div style={{ fontSize: 10, fontWeight: 500, color: "#9ca3af", letterSpacing: "0.07em", marginBottom: 6 }}>DATA STORAGE</div>
            <div style={{ fontSize: 12, color: "#6b7280", lineHeight: 1.6, marginBottom: 12 }}>
              {FS_SUPPORTED && dirHandle
                ? <>Saving to <code style={{ background: "#f3f4f6", padding: "1px 5px", borderRadius: 3, fontSize: 11 }}>data.json</code> in <strong style={{ color: "#374151" }}>{dirHandle.name}</strong>.</>
                : FS_SUPPORTED
                  ? "No data folder set. Pick one to save your data as a real file."
                  : "Saving to browser localStorage (Chrome/Edge required for file-based storage)."}
            </div>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              {FS_SUPPORTED && (
                <button onClick={pickFolder} style={s.btnGhost}>
                  {dirHandle ? "Change folder…" : "Choose folder…"}
                </button>
              )}
              <button onClick={backupData} style={s.btnGhost}>↓ Download backup</button>
              <button onClick={() => restoreInputRef.current?.click()} style={s.btnGhost}>↑ Restore from backup</button>
            </div>
            <input ref={restoreInputRef} type="file" accept=".json" onChange={restoreData}
              style={{ display: "none" }} />
          </div>

          </div>

        )}

      </div>

      {pending && (
        <EntryModal
          initial={pending}
          projects={projects}
          date={selectedDay}
          onConfirm={confirmEntry}
          onCancel={cancelEntry}
        />
      )}
      {editing && (
        <EntryModal
          initial={{
            startMin: editing.startMinutes,
            durationMin: hoursToMin(editing.hours),
            projectId: editing.projectId,
            note: editing.note,
            entryId: editing.id,
          }}
          projects={projects}
          date={editing.date}
          onConfirm={updateEntry}
          onCancel={cancelEdit}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
